<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rimon EasyCalc</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#172033
    }
    .app{width:100%;max-width:430px}
    .card{
      background:#fff;border:1px solid #dfe5ee;border-radius:24px;padding:20px;
      box-shadow:0 12px 35px rgba(20,35,60,.10)
    }
    h1{margin:0;font-size:25px}
    .sub{margin:5px 0 18px;color:#718096;font-size:14px}
    .display{
      background:#f5f7fa;border-radius:18px;padding:15px;text-align:right;
      margin-bottom:14px;min-height:88px
    }
    #expression{height:22px;color:#7b8798;font-size:14px;overflow:hidden}
    #display{font-size:34px;font-weight:700;overflow-wrap:anywhere;margin-top:5px}
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
    button{
      border:0;border-radius:15px;min-height:58px;font-size:20px;font-weight:700;
      background:#f0f3f7;color:#172033;cursor:pointer
    }
    .op{background:#e5eaf2}
    .equal{background:#111827;color:#fff}
    .clear{background:#ffe9e9;color:#b42318}
    .zero{grid-column:span 2}
    .payment{display:none;margin-top:16px}
    .payment.show{display:block}
    .payment h2{font-size:20px;margin:0 0 8px}
    .amount{font-size:26px;font-weight:800;margin:5px 0 16px}
    .bkash{border:1px solid #e2e7ef;border-radius:18px;padding:15px}
    .badge{
      display:inline-block;background:#f4e6ff;color:#7b2cbf;padding:6px 10px;
      border-radius:999px;font-size:12px;font-weight:800
    }
    .number{
      margin:12px 0;padding:13px;border-radius:12px;background:#f6f7f9;
      text-align:center;font-size:21px;font-weight:800;letter-spacing:1px
    }
    .hint{font-size:13px;line-height:1.5;color:#667085}
    input{
      width:100%;height:50px;border:1px solid #d8dee8;border-radius:12px;
      padding:0 13px;font-size:16px;outline:none;margin-top:10px
    }
    input:focus{border-color:#7b2cbf}
    .submit{width:100%;margin-top:9px;background:#111827;color:#fff;font-size:16px}
    #status{font-size:13px;margin:10px 0 0;min-height:18px}
    .note{font-size:11px;color:#8a94a6;text-align:center;margin-top:13px}
  </style>
</head>

<body>

<main class="app">
  <section class="card">

    <h1>Rimon EasyCalc</h1>
    <p class="sub">Fast & simple calculation</p>

    <div class="display">
      <div id="expression"></div>
      <div id="display">0</div>
    </div>

    <div class="keys">
      <button class="clear" onclick="clearCalc()">AC</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="add('(')">(</button>
      <button class="op" onclick="add('÷')">÷</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button class="op" onclick="add('×')">×</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button class="op" onclick="add('-')">−</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button class="op" onclick="add('+')">+</button>

      <button class="zero" onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>

    <!-- PAYMENT SECTION -->
    <section id="payment" class="payment">

      <h2>Payment Required</h2>

      <div class="amount" id="amount">৳ 0</div>

      <div class="bkash">

        <span class="badge">bKash • Send Money</span>

        <p class="hint">
          Please send the exact amount to the bKash number below.
        </p>

        <div class="number">
          01882333181
        </div>

        <p class="hint">
          Send Money করার পর payment-এর Transaction ID নিচে দিন।
        </p>

        <input
          id="trx"
          type="text"
          maxlength="40"
          placeholder="Enter your TRX / Transaction ID"
        >

        <button class="submit" onclick="submitTrx()">
          Submit TRX
        </button>

        <div id="status"></div>

      </div>

    </section>

    <div class="note">
      Payment Method: bKash Send Money
    </div>

  </section>
</main>

<script>
let expression = '';

function render(){
  document.getElementById('display').textContent = expression || '0';
}

function add(value){

  if(
    /[+×÷-]/.test(value) &&
    (!expression || /[+×÷-]$/.test(expression))
  ) return;

  if(
    value === '.' &&
    /(?:^|[+×÷-])[^+×÷-]*\.$/.test(expression)
  ) return;

  expression += value;
  render();
}

function backspace(){
  expression = expression.slice(0,-1);
  render();
}

function clearCalc(){

  expression = '';

  document.getElementById('expression').textContent = '';
  document.getElementById('payment').classList.remove('show');
  document.getElementById('status').textContent = '';
  document.getElementById('trx').value = '';

  render();
}

function calculate(){

  if(!expression) return;

  const raw = expression
    .replaceAll('×','*')
    .replaceAll('÷','/');

  if(!/^[0-9+*/(). -]+$/.test(raw)) return;

  try{

    const result = Function(
      '"use strict";return (' + raw + ')'
    )();

    if(!Number.isFinite(result)) throw new Error();

    const rounded =
      Math.round((result + Number.EPSILON) * 100000000) / 100000000;

    document.getElementById('expression').textContent =
      expression + ' =';

    document.getElementById('display').textContent =
      rounded;

    document.getElementById('amount').textContent =
      '৳ ' + rounded.toLocaleString('en-BD');

    document.getElementById('payment').classList.add('show');

    document.getElementById('payment').scrollIntoView({
      behavior:'smooth',
      block:'nearest'
    });

  }catch(e){

    document.getElementById('display').textContent =
      'Invalid';

  }
}

function submitTrx(){

  const trx =
    document.getElementById('trx').value.trim();

  const status =
    document.getElementById('status');

  if(!trx){

    status.style.color = '#b42318';
    status.textContent =
      'Please enter your Transaction ID.';

    return;
  }

  status.style.color = '#16794f';

  status.textContent =
    'Transaction ID submitted: ' + trx;

}

document.addEventListener('keydown',function(e){

  if(e.target.tagName === 'INPUT') return;

  if(/[0-9.+-]/.test(e.key))
    add(e.key);

  else if(e.key === '*')
    add('×');

  else if(e.key === '/')
    add('÷');

  else if(e.key === 'Enter' || e.key === '=')
    calculate();

  else if(e.key === 'Backspace')
    backspace();

  else if(e.key === 'Escape')
    clearCalc();

});
</script>

</body>
</html>
